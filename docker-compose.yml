# Baza danych na Twoim komputerze. Start: npm run db, stop: npm run db:stop.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_polish_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql

  # Podgląd bazy w przeglądarce: http://localhost:8080 (albo port z PHPMYADMIN_PORT w .env; zobacz README.md)
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

  # Skrzynka testowa: wszystkie e-maile z aplikacji, http://localhost:8025 albo port z MAILPIT_PORT w .env
  # (nikt ich naprawdę nie dostaje). Aplikacja wysyła na SMTP_PORT (domyślnie 1025).
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  mysql_data:
